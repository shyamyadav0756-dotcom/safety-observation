<script>
    const SUPABASE_URL = "https://eqlnoxmfbegkgfemneq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxbG5veG1mYmVna2dmZW1uZXEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczODMwNzk1NiwiZXhwIjoyMDUzODgzOTU2fQ.6_mS_wF_V_g7uUf3Jq8g6L4hN2K9mY1Vz7X0W3Q";

    document.getElementById('obsForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Saving...";

        const payload = {
            observation_date: document.getElementById('date_time').value ? new Date(document.getElementById('date_time').value).toISOString() : new Date().toISOString(),
            location: document.getElementById('tower').value,
            observation_type: document.getElementById('obs_type').value,
            risk_level: document.getElementById('risk_level').value,
            description: document.getElementById('description').value,
            corrective_action: document.getElementById('corrective_action').value,
            reported_by: 'GHANSYAM',
            status: 'Open'
        };

        try {
            // URL aur Authorization header mein Backticks (`) add kiye gaye hain
            const res = await fetch(`${SUPABASE_URL}/rest/v1/safety_observations`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Observation Saved Successfully! (डेटाबेस में सेव हो गया)");
                document.getElementById('obsForm').reset();
            } else {
                const errData = await res.json();
                alert("Database Error: " + (errData.message || res.statusText));
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Save Observation";
        }
    });
</script>
