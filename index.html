<body>

<div id="loginOverlay">

        <p id="passErr" style="color:red; display:none;">Wrong Password!</p>

<div class="container">
    <h2>MILESTONES -- SAFETY OBSERVATION</h2>
    <p style="text-align:center; font-size:12px; color:#555;">Project: SWARNA | HSE Officer: GHANSYAM</p>
    <hr>
    
    <form id="obsForm">
        <label>Date & Time</label>
        <input type="datetime-local" id="date_time" required>

        <label>Tower / Location</label>
        <input type="text" id="tower" placeholder="e.g. Tower A, Floor 5" required>

        <label>Observation Type</label>
        <select id="obs_type">
            <option value="Unsafe Condition">Unsafe Condition</option>
            <option value="Unsafe Act">Unsafe Act</option>
            <option value="Safe Practice">Safe Practice</option>
        </select>

        <label>Risk Level</label>
        <select id="risk_level">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
        </select>

        <label>Observation Description</label>
        <textarea id="description" rows="3" placeholder="Describe the unsafe act/condition..." required></textarea>

        <label>Immediate Corrective Action</label>
        <textarea id="corrective_action" rows="2" placeholder="Action taken on spot..."></textarea>

        <button type="submit" id="submitBtn">Save Observation</button>
    </form>
</div>

<script>
    function checkPass() {
        const pass = document.getElementById('passInput').value;
        if(pass === '1234') {
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            document.getElementById('passErr').style.display = 'block';
        }
    }

    const SUPABASE_URL = 'https://eqlnoxmfbegkgfemneq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxbG5veG1mYmVna2dmZW1uZXEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczODMwNzk1NiwiZXhwIjoyMDUzODgzOTU2fQ.6_mS_wF_V_g7uUf3Jq8g6L4hN2K9mY1Vz7X0W3Q'; // standard anon key setup

    // Initialize Supabase Client safely
    let supabaseClient;
    if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    document.getElementById('obsForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Saving...";

        const payload = {
            created_at: document.getElementById('date_time').value || new Date().toISOString(),
            tower: document.getElementById('tower').value,
            observation_type: document.getElementById('obs_type').value,
            risk_level: document.getElementById('risk_level').value,
            description: document.getElementById('description').value,
            corrective_action: document.getElementById('corrective_action').value,
            project_name: 'SWARNA',
            hse_officer: 'GHANSYAM'
        };

        try {
            const { data, error } = await supabaseClient.from('safety_observations').insert([payload]);
            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert("Observation saved successfully!");
                document.getElementById('obsForm').reset();
            }
        } catch (err) {
            alert("Submission error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Save Observation";
        }
    });
</script>
