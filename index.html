<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safety Observation | Milestones - Swarna</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
   })();
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf3fa,#f5f1ff 55%,#fff7e8);color:#172033}
  header{background:linear-gradient(115deg,#061d31,#075985 55%,#0f766e);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5;box-shadow:0 5px 18px #0003}
  header h1{margin:0;font-size:22px;letter-spacing:.3px;font-weight:900}
  header p{margin:6px 0 0;font-size:13px;opacity:.9}
  .container{max-width:1180px;margin:auto;padding:18px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .card{background:#fff;border-radius:16px;padding:17px;box-shadow:0 5px 18px #18334a18;border:1px solid #dce5ee}
  .cards .card:nth-child(1){border-left:6px solid #1677ff}
  .cards .card:nth-child(2){border-left:6px solid #f59e0b}
  .cards .card:nth-child(3){border-left:6px solid #e63946}
  .cards .card:nth-child(4){border-left:6px solid #16a34a}
  .card b{font-size:27px;display:block}.card span{font-size:12px;color:#667085}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
  label{font-size:13px;font-weight:900;display:block;margin-bottom:6px;color:#172033}
  input,select,textarea{width:100%;padding:12px;border:2px solid #c5d0db;border-radius:10px;font-size:14px;background:#fff;outline:none;transition:.2s;font-weight:500}
  input:focus,select:focus,textarea:focus{border-color:#1677ff;box-shadow:0 0 0 3px #1677ff1c}
  textarea{min-height:95px;resize:vertical}
  button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.15s;font-size:13px}
  .primary{background:linear-gradient(135deg,#1677ff,#5b5ce2);color:#fff;box-shadow:0 4px 12px #1677ff33}
  .primary:hover{transform:translateY(-1px)}
  .secondary{background:#edf2f7;color:#17202a}
  .danger{background:#e63946;color:#fff}
  .whatsapp-btn{background:#25D366;color:#fff;box-shadow:0 4px 12px #25d36633}
  .whatsapp-btn:hover{background:#20ba5a}
  .email-btn{background:#ea4335;color:#fff;box-shadow:0 4px 12px #ea433533}
  .email-btn:hover{background:#d93025}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photo-preview img{width:100px;height:75px;object-fit:cover;border-radius:9px;border:2px solid #dbeafe}
  .section-title{margin:18px 0 10px;color:#082f49;font-weight:900}
  .toolbar{display:flex;gap:8px;margin:10px 0}.toolbar input{flex:1}
  .observation{background:#fff;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 4px 15px #17324d14;border:1px solid #d7e0e8;border-left:6px solid #1677ff}
  .obs-top{display:flex;justify-content:space-between;gap:10px}
  .badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block}
  .open{background:#fff0c2;color:#8a5700}.closed{background:#d9f7e2;color:#087a35}
  .critical{background:#ffd9dc;color:#a40e1c}.medium{background:#fff0c2;color:#8a5700}
  .low{background:#dff3ff;color:#075985}.high{background:#ffe0c7;color:#9a3412}
  .muted{color:#526273;font-size:12px}
  .obs-photo{max-width:170px;max-height:120px;border-radius:9px;margin-top:8px;border:1px solid #ddd}
  @media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}.obs-top{align-items:flex-start}.toolbar{flex-wrap:wrap}.toolbar input{min-width:100%}}
  @media print{.header,.toolbar,.no-print,.cards,#form-card{display:none!important}body{background:white}.observation{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>

<header>
  <h1>🦺 MILESTONES -- SAFETY OBSERVATION</h1>
  <p>Project: SWARNA | HSE Officer: GHANSYAM</p>
</header>

<div class="container">
  <div class="cards">
    <div class="card"><b id="total">0</b><span>Total</span></div>
    <div class="card"><b id="open">0</b><span>Open</span></div>
    <div class="card"><b id="critical">0</b><span>Critical</span></div>
    <div class="card"><b id="closed">0</b><span>Closed</span></div>
  </div>

  <div class="card" id="form-card">
    <h2 class="section-title">➕ New Safety Observation</h2>
    <form id="form">
      <div class="grid">
        <div><label>Date & Time</label><input id="date" type="datetime-local" required></div>
        <div>
          <label>Tower / Location</label>
          <select id="location" required>
            <option value="">-- Select Tower --</option>
            <option>Tower A</option>
            <option>Tower B</option>
            <option>Tower CD (Combined)</option>
            <option>Tower EF (Combined)</option>
            <option>Tower GH (Combined)</option>
            <option>Tower I</option>
            <option>Tower J</option>
            <option>Batching Plant</option>
            <option>Material Yard</option>
            <option>Other Site Area</option>
          </select>
        </div>
        <div><label>Observation Type</label>
          <select id="type">
            <option>Unsafe Condition</option>
            <option>Unsafe Act</option>
            <option>Good Practice</option>
            <option>PPE</option>
            <option>Electrical</option>
            <option>Work at Height</option>
            <option>Scaffolding</option>
            <option>Lifting & Rigging</option>
            <option>Housekeeping</option>
            <option>Fire Safety</option>
            <option>Environmental</option>
          </select>
        </div>
        <div><label>Risk Level</label>
          <select id="risk">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Critical</option>
          </select>
        </div>
        <div class="full"><label>Observation Description</label><textarea id="description" placeholder="Describe the unsafe act/condition..." required></textarea></div>
        <div class="full"><label>Immediate Corrective Action</label><textarea id="action" placeholder="What action was taken or required?"></textarea></div>
        <div><label>Responsible Person / Contractor</label><input id="responsible" placeholder="Name or Agency"></div>
        <div><label>Contact Mobile (WhatsApp)</label><input id="mobile" placeholder="e.g. 919876543210"></div>
        <div><label>Target Date</label><input id="target" type="date"></div>
        <div><label>Status</label><select id="status"><option>Open</option><option>Closed</option></select></div>
        <div class="full"><label>Observation Photo</label><input id="photo" type="file" accept="image/*" capture="environment"></div>
        <div class="full"><div id="preview" class="photo-preview"></div></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">Save Observation</button>
        <button class="secondary" type="reset" id="resetBtn">Clear</button>
      </div>
    </form>
  </div>

  <h2 class="section-title">📋 Observation Register</h2>
  <div class="toolbar no-print">
    <input id="search" placeholder="Search location, contractor, description...">
    <select id="filter">
      <option>All</option>
      <option>Open</option>
      <option>Closed</option>
      <option>Critical</option>
    </select>
    <button class="secondary" onclick="window.print()">🖨️ Print / PDF Report</button>
  </div>
  
  <div id="list"></div>
</div>

<script>
  const $=id=>document.getElementById(id);
  let data=JSON.parse(localStorage.getItem("milestones_swarna_observations")||"[]");
  let photoData="";

  function setNow(){
    let d=new Date();
    d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    $("date").value=d.toISOString().slice(0,16);
  }
  setNow();

  $("photo").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{photoData=r.result;$("preview").innerHTML=<img src="${photoData}">};
    r.readAsDataURL(f);
  });

  $("form").addEventListener("submit",e=>{
   e.preventDefault();
   const newObs = {
    id:Date.now(),
    date:$("date").value,
    location:$("location").value,
    type:$("type").value,
    risk:$("risk").value,
    description:$("description").value,
    action:$("action").value,
    responsible:$("responsible").value,
    mobile:$("mobile").value,
    target:$("target").value,
    status:$("status").value,
    photo:photoData
   };
   data.unshift(newObs);
   localStorage.setItem("milestones_swarna_observations",JSON.stringify(data));
   e.target.reset();photoData="";$("preview").innerHTML="";setNow();render();
  });

  $("resetBtn").addEventListener("click",()=>{photoData="";$("preview").innerHTML="";setTimeout(setNow,0)});
  $("search").addEventListener("input",render);
  $("filter").addEventListener("change",render);

  function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

  function sendWhatsApp(id){
    const o = data.find(x=>x.id===id);
    if(!o) return;
    const msg = 🚨 *SAFETY OBSERVATION ALERT* 🚨\n\n +
                🏢 *Project:* SWARNA\n +
                📍 *Location:* ${o.location}\n +
                ⚠️ *Type:* ${o.type}\n +
                🔥 *Risk Level:* ${o.risk}\n +
                📝 *Description:* ${o.description}\n +
                🛠️ *Action Needed:* ${o.action||"N/A"}\n +
                👤 *Responsible:* ${o.responsible||"N/A"}\n +
                📅 *Target Date:* ${o.target||"N/A"}\n +
                📊 *Status:* ${o.status};
    const phone = o.mobile ? o.mobile.replace(/[^0-9]/g, '') : '';
    const url = https://wa.me/${phone}?text=${encodeURIComponent(msg)};
    window.open(url, '_blank');
  }

  function sendEmail(id){
    const o = data.find(x=>x.id===id);
    if(!o) return;
    const emailTo = prompt("Enter Receiver Email ID:", "safety.head@company.com");
    if(!emailTo) return;
    
    const subject = encodeURIComponent([SAFETY ALERT] ${o.risk} - ${o.location});
    const body = encodeURIComponent(Project: SWARNA\nLocation: ${o.location}\nType: ${o.type}\nRisk: ${o.risk}\nDescription: ${o.description}\nAction: ${o.action}\nResponsible: ${o.responsible}\nTarget: ${o.target}\nStatus: ${o.status});
    window.location.href = mailto:${emailTo}?subject=${subject}&body=${body};
  }

  function render(){
   const q=$("search").value.toLowerCase(), f=$("filter").value;
   const shown=data.filter(o=>(f==="All"||o.status===f||o.risk===f)&&JSON.stringify(o).toLowerCase().includes(q));
   
   $("total").textContent=data.length;
   $("open").textContent=data.filter(o=>o.status==="Open").length;
   $("critical").textContent=data.filter(o=>o.risk==="Critical").length;
   $("closed").textContent=data.filter(o=>o.status==="Closed").length;

   $("list").innerHTML=shown.length?shown.map(o=>`
   <div class="observation">
    <div class="obs-top">
      <div><b>${esc(o.type)}</b><div class="muted">${new Date(o.date).toLocaleString()} · ${esc(o.location)}</div></div>
      <div><span class="badge ${o.risk.toLowerCase()}">${esc(o.risk)}</span> <span class="badge ${o.status.toLowerCase()}">${esc(o.status)}</span></div>
    </div>
    <p><b>Observation:</b> ${esc(o.description)}</p>
    <p><b>Corrective Action:</b> ${esc(o.action)||"--"}</p>
    <p class="muted"><b>Responsible:</b> ${esc(o.responsible)||"--"} ${o.mobile?`(${esc(o.mobile)})`:""} &nbsp; <b>Target:</b> ${esc(o.target)||"--"}</p>
    ${o.photo?<img class="obs-photo" src="${o.photo}">:""}
    <div class="actions no-print">
     <button class="whatsapp-btn" onclick="sendWhatsApp(${o.id})">💬 WhatsApp Alert</button>
     <button class="email-btn" onclick="sendEmail(${o.id})">📧 Email Alert</button>
     ${o.status==="Open"?<button class="primary" onclick="closeObs(${o.id})">Mark Closed</button>:""}
     <button class="danger" onclick="removeObs(${o.id})">Delete</button>
    </div>
   </div>`).join(""):"<div class='card'>No observations found.</div>";
  }

  function closeObs(id){
    let o=data.find(x=>x.id===id);
    if(o){o.status="Closed";localStorage.setItem("milestones_swarna_observations",JSON.stringify(data));render()}
  }

  function removeObs(id){
    if(confirm("Delete this observation?")){
      data=data.filter(o=>o.id!==id);
      localStorage.setItem("milestones_swarna_observations",JSON.stringify(data));
      render();
    }
  }
  render();
</script>
</body>
</html>
